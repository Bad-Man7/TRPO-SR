<!DOCTYPE html>
<html>
<head><title>Мои заметки</title></head>
<body>
    <h1>Заметки</h1>
    <a href="/add">Добавить заметку</a>
    <ul>
        {% for note in notes %}
            <li>
                <strong>{{ note[1] }}</strong> (Теги: {{ note[3] }})<br>
                {{ note[2] }}<br>
                <a href="/edit/{{ note[0] }}">Редактировать</a> | 
                <a href="/delete/{{ note[0] }}">Удалить</a>
            </li>
        {% else %}
            <li>Заметок пока нет.</li>
        {% endfor %}
    </ul>
</body>
</html>
